# Institution registry: the seeded half. Identity and official domains only --
# this file says where to look, never what anyone does (AGENTS.md principle 1).
# It holds no people: a row here is a public fact about an organisation, which
# is the whole reason this registry has a seed and the researcher registry
# never will (AGENTS.md -> Personal Data).
#
# Where the rows come from. 67 rows, labelled `edunexus-seed`, join two EduNexus
# data files (Apache-2.0; see NOTICE) on ror_id: the ROR canonical name is the
# row's name, because the ROR id is what makes it citable, and the domain
# file's own name is kept in aliases where the two differ. 41 rows, labelled
# `maintainer-run`, were confirmed by hand: five Netherlands rows read on a real
# run, and 36 rows across Belgium, Denmark, Finland, France, Germany, the
# Netherlands, Sweden and Switzerland built from the Research Organization
# Registry (https://ror.org, CC0) after an HTTPS read of every domain returned
# 2xx on a page naming the institution. The same run added one domain to the
# Southampton row. Sorted by country then name. 108 rows.
#
# Runs never write here. A row a run confirms is appended to the gitignored
# registry/institutions.yml, and both files are read as one list
# (DATA_CONTRACT.md -> One Registry Ships A Seed).
